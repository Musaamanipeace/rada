name: CI

on:
  push:
    branches: [main, "phase-*/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build & Docs Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgresPassword
          POSTGRES_DB: rada
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgresPassword@localhost:5432/rada?schema=public"
      AUTH_SECRET: "test_ci_auth_secret_minimum_32_characters_key"
      NEXT_TELEMETRY_DISABLED: 1
      FEATURE_WATCH_ADS_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.18.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify documentation and links
        run: |
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f README.md
          test -f CHANGELOG.md
          test -f data/taxonomy.json
          test -f docs/product/decisions.md
          test -f docs/product/open-questions.md
          test -f docs/privacy.md
          test -f docs/ad-policy.md
          pnpm check:links

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Prisma migrations
        run: pnpm db:migrate:deploy

      - name: Seed taxonomy
        run: pnpm db:seed

      - name: Automated taxonomy validation
        run: pnpm test:taxonomy

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Next.js app
        run: pnpm build

      - name: Check bundle budget
        run: pnpm check:budget
