name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build & Docs Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required documentation & governance files exist
        run: |
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f README.md
          test -f CHANGELOG.md
          test -f data/taxonomy.json
          test -f docs/product/decisions.md
          test -f docs/product/open-questions.md
          test -f docs/privacy.md
          test -f docs/ad-policy.md

      # Phase 0 will enable the full Node/pnpm/PostgreSQL pipeline below:
      # - pnpm install --frozen-lockfile
      # - pnpm lint
      # - pnpm typecheck
      # - pnpm test:taxonomy
      # - pnpm test
      # - pnpm build
      # - pnpm test:e2e
